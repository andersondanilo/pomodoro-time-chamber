name: Release

# release-please keeps a "release PR" open on master (version bump in Cargo.toml and
# CHANGELOG.md, built from conventional commits). Merging that PR creates the tag and the
# GitHub release, and the build job below attaches the Linux binary to it.
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          # A personal access token instead of GITHUB_TOKEN: no need to enable "Allow GitHub
          # Actions to create and approve pull requests", and the release PR triggers other
          # workflows. See README > Releases for how to create the secret.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-linux:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    # An older runner image links against an older glibc, so the binary runs on more distros.
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          name="ptc-${TAG}-x86_64-linux"
          mkdir "$name"
          cp target/release/ptc README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Attach to the release
        run: gh release upload "$TAG" ptc-*.tar.gz ptc-*.tar.gz.sha256 --clobber
