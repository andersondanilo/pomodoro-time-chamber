name: Publish AUR package

# Publishes aur/PKGBUILD to the AUR for a released tag. Called by the release workflow, and can be
# run by hand (Actions > Publish AUR package > Run workflow) to publish an existing release, for
# example after the AUR_SSH_PRIVATE_KEY secret was added.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v1.0.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # Without the key (e.g. no AUR account yet) the job is skipped instead of failing the release.
      - name: Check for the AUR key
        id: key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set, skipping the AUR publication of $TAG."
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
        with:
          ref: ${{ inputs.tag }}

      - name: Set the released version in the PKGBUILD
        if: steps.key.outputs.present == 'true'
        run: sed -i "s/^pkgver=.*/pkgver=${TAG#v}/; s/^pkgrel=.*/pkgrel=1/" aur/PKGBUILD

      # Refreshes the checksum, test-builds the package in an Arch container, regenerates
      # .SRCINFO and pushes PKGBUILD + .SRCINFO to the AUR.
      - uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        if: steps.key.outputs.present == 'true'
        with:
          pkgname: pomodoro-time-chamber
          pkgbuild: ./aur/PKGBUILD
          updpkgsums: true
          test: true
          commit_username: andersondanilo
          commit_email: andersondanilo@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ env.TAG }}
